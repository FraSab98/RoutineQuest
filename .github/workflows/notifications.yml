
name: Routine Quest Notifications

on:
  workflow_dispatch:

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push notifications
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --retry 2 \
            --max-time 120 \
            -X POST "$RENDER_URL/api/dispatch" \
            -H "Authorization: Bearer $CRON_SECRET"
